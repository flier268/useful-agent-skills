interface:
  display_name: "Review With Session"
  short_description: "Review code with a resumable session for bugs, debt, and dead code."
  default_prompt: "Use $review-with-session for resumable code review. Default to current uncommitted changes. Also use it for staged-only, branch, whole-project, and security review. Prioritize potential bugs, regressions, incomplete minimal fixes, technical debt introduced by the reviewed scope, and dead code. Read session files through the helper CLI."
